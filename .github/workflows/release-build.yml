name: Build & Publish APEX-HID-Suite Release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile Self-Contained .NET 8 Windows x64 & Package Setup
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 8.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Dependencies
        run: dotnet restore APEX-HID-Suite.sln

      - name: Build Solution (Release x64)
        run: dotnet build APEX-HID-Suite.sln --configuration Release --no-restore

      - name: Publish Standalone Self-Contained ApexHid.App.exe
        run: |
          dotnet publish src/ApexHid.App/ApexHid.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            --output publish/APEX-HID-Suite

      - name: Stage Standalone App Payload for Installer Bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/ApexHid.Installer/Payload | Out-Null
          Copy-Item "publish/APEX-HID-Suite/ApexHid.App.exe" "src/ApexHid.Installer/Payload/ApexHid.App.exe" -Force

      - name: Publish Standalone Self-Contained APEX-HID-Setup.exe
        run: |
          dotnet publish src/ApexHid.Installer/ApexHid.Installer.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:IncludeAllContentForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            --output publish/Installer

      - name: Package Release Archives & Compute SHA-256 Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item "publish/Installer/APEX-HID-Setup.exe" "artifacts/APEX-HID-Setup.exe" -Force
          Copy-Item "publish/APEX-HID-Suite/ApexHid.App.exe" "artifacts/ApexHid.App.exe" -Force
          Compress-Archive -Path "publish/APEX-HID-Suite/*" -DestinationPath "artifacts/APEX-HID-Suite-win-x64.zip" -Force

          $setupHash = (Get-FileHash "artifacts/APEX-HID-Setup.exe" -Algorithm SHA256).Hash
          $appHash   = (Get-FileHash "artifacts/ApexHid.App.exe" -Algorithm SHA256).Hash
          $zipHash   = (Get-FileHash "artifacts/APEX-HID-Suite-win-x64.zip" -Algorithm SHA256).Hash

          @(
            "$setupHash  APEX-HID-Setup.exe"
            "$appHash  ApexHid.App.exe"
            "$zipHash  APEX-HID-Suite-win-x64.zip"
          ) | Set-Content -Path "artifacts/SHA256SUMS.txt" -Encoding UTF8

          Get-Content "artifacts/SHA256SUMS.txt"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: APEX-HID-Suite-win-x64
          path: |
            artifacts/APEX-HID-Setup.exe
            artifacts/ApexHid.App.exe
            artifacts/APEX-HID-Suite-win-x64.zip
            artifacts/SHA256SUMS.txt

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/APEX-HID-Setup.exe
            artifacts/ApexHid.App.exe
            artifacts/APEX-HID-Suite-win-x64.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
